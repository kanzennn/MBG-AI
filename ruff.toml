# Pin the rule set explicitly rather than relying on ruff's built-in default
# selection, which turned out to include far more than intended (pyupgrade,
# flake8-bandit, flake8-datetimez, pylint, isort...) and isn't stable across
# ruff versions. This project only lints for genuine correctness issues:
# pyflakes (F) and pycodestyle errors (E4/E7/E9) — the same set CI actually
# needs to pass, not a moving target.
[lint]
select = ["E4", "E7", "E9", "F"]
