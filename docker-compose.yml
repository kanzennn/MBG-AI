services:
  app:
    image: ${APP_IMAGE:-sentiment-analysis:latest}
    container_name: sentiment-app
    restart: unless-stopped
    env_file: .env
    volumes:
      # Trained model weights are gitignored (large binary artifact) and
      # never baked into the image — train locally, then copy the resulting
      # model_output_tweet/best directory here once. Must match
      # INGEST_MODEL_DIR in .env (default: model_output_tweet/best).
      - ./model_output_tweet:/app/model_output_tweet:ro
      # Ingest run logs (rotating, see ingest/worker.py) — readable directly
      # from the host at ./logs/ingest.log without exec-ing into the
      # container. Must match INGEST_LOG_FILE in .env (default: logs/ingest.log).
      - ./logs:/app/logs
    extra_hosts:
      # Lets PAWONWARGA_BASE_URL point at http://host.docker.internal:<port>
      # to reach PawonWarga-BE's port published on this same VPS host.
      # MONGODB_URL reaches Argus v3's MongoDB directly (its own host/IP, not
      # via this gateway) — see ingest/config.py.
      - "host.docker.internal:host-gateway"
    networks:
      - internal

networks:
  internal:
    driver: bridge
